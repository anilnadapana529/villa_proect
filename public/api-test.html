<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }
        .test-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .response {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .token-display {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            word-break: break-all;
        }
        .success { color: #28a745; font-weight: 600; }
        .error { color: #dc3545; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 API Testing Tool</h1>
            <p>Test your Villa Booking API endpoints</p>
        </div>

        <div class="content">
            <div class="test-section">
                <h3>🔓 Public Endpoint Test</h3>
                <button onclick="testPublicAPI()">Test /home-data</button>
                <div id="publicResponse" class="response" style="display: none;"></div>
            </div>

            <div class="test-section">
                <h3>🔐 Admin Login</h3>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" value="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" value="admin123">
                </div>
                <button onclick="testAdminLogin()">Login as Admin</button>
                <div id="adminResponse" class="response" style="display: none;"></div>
            </div>

            <div class="test-section">
                <h3>👤 Owner Login</h3>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="ownerEmail" value="owner@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="ownerPassword" value="owner123">
                </div>
                <button onclick="testOwnerLogin()">Login as Owner</button>
                <div id="ownerResponse" class="response" style="display: none;"></div>
            </div>

            <div class="test-section">
                <h3>🎯 Protected Endpoint Test</h3>
                <div class="form-group">
                    <label>Token (Get from login above)</label>
                    <input type="text" id="authToken" placeholder="Paste token here">
                </div>
                <div class="form-group">
                    <label>Endpoint</label>
                    <select id="protectedEndpoint">
                        <option value="admin-stats">Admin Stats</option>
                        <option value="admin-owners">Admin Owners List</option>
                        <option value="admin-villas">Admin Villas List</option>
                        <option value="owner-stats">Owner Stats</option>
                        <option value="owner-villas">Owner Villas</option>
                        <option value="owner-bookings">Owner Bookings</option>
                    </select>
                </div>
                <button onclick="testProtectedAPI()">Test Protected Endpoint</button>
                <div id="protectedResponse" class="response" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const baseURL = window.location.origin;
        let savedToken = '';

        async function testPublicAPI() {
            const responseDiv = document.getElementById('publicResponse');
            responseDiv.style.display = 'block';
            responseDiv.innerHTML = 'Loading...';

            try {
                const response = await fetch(`${baseURL}/api/home-data`);
                const data = await response.json();

                responseDiv.innerHTML = `<span class="success">✓ Success (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                responseDiv.innerHTML = `<span class="error">✗ Error</span>\n\n${error.message}`;
            }
        }

        async function testAdminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const responseDiv = document.getElementById('adminResponse');

            responseDiv.style.display = 'block';
            responseDiv.innerHTML = 'Loading...';

            try {
                const response = await fetch(`${baseURL}/api/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.token) {
                    savedToken = data.token;
                    document.getElementById('authToken').value = data.token;
                    responseDiv.innerHTML = `<span class="success">✓ Success (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}\n\n<div class="token-display">Token copied to protected test section below ↓</div>`;
                } else {
                    responseDiv.innerHTML = `<span class="error">✗ Failed (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<span class="error">✗ Error</span>\n\n${error.message}`;
            }
        }

        async function testOwnerLogin() {
            const email = document.getElementById('ownerEmail').value;
            const password = document.getElementById('ownerPassword').value;
            const responseDiv = document.getElementById('ownerResponse');

            responseDiv.style.display = 'block';
            responseDiv.innerHTML = 'Loading...';

            try {
                const response = await fetch(`${baseURL}/api/owner-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.token) {
                    savedToken = data.token;
                    document.getElementById('authToken').value = data.token;
                    responseDiv.innerHTML = `<span class="success">✓ Success (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}\n\n<div class="token-display">Token copied to protected test section below ↓</div>`;
                } else {
                    responseDiv.innerHTML = `<span class="error">✗ Failed (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<span class="error">✗ Error</span>\n\n${error.message}`;
            }
        }

        async function testProtectedAPI() {
            const token = document.getElementById('authToken').value;
            const endpoint = document.getElementById('protectedEndpoint').value;
            const responseDiv = document.getElementById('protectedResponse');

            if (!token) {
                responseDiv.style.display = 'block';
                responseDiv.innerHTML = '<span class="error">✗ Please provide a token (login first)</span>';
                return;
            }

            responseDiv.style.display = 'block';
            responseDiv.innerHTML = 'Loading...';

            try {
                const response = await fetch(`${baseURL}/api/${endpoint}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerHTML = `<span class="success">✓ Success (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    responseDiv.innerHTML = `<span class="error">✗ Failed (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<span class="error">✗ Error</span>\n\n${error.message}`;
            }
        }
    </script>
</body>
</html>
