<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container">
        <h1>API Test Page</h1>
        
        <div class="card mt-4">
            <div class="card-header"><h3>Test User Registration</h3></div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testRegister()">Test Register API</button>
                <div id="registerResult" class="mt-3"></div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header"><h3>Test User Login</h3></div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testLogin()">Test Login API</button>
                <div id="loginResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
    async function testRegister() {
        const result = document.getElementById('registerResult');
        result.innerHTML = 'Testing...';
        
        try {
            const response = await fetch('/api/user-register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: 'Test User',
                    email: 'test' + Date.now() + '@test.com',
                    phone: '1234567890',
                    password: 'test123'
                })
            });
            
            const data = await response.json();
            result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            result.className = 'mt-3 alert ' + (data.status ? 'alert-success' : 'alert-danger');
        } catch (error) {
            result.innerHTML = '<strong>Error:</strong> ' + error.message;
            result.className = 'mt-3 alert alert-danger';
        }
    }

    async function testLogin() {
        const result = document.getElementById('loginResult');
        result.innerHTML = 'Testing...';
        
        try {
            const response = await fetch('/api/user-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: 'test@test.com',
                    password: 'test123'
                })
            });
            
            const data = await response.json();
            result.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            result.className = 'mt-3 alert ' + (data.status ? 'alert-success' : 'alert-danger');
        } catch (error) {
            result.innerHTML = '<strong>Error:</strong> ' + error.message;
            result.className = 'mt-3 alert alert-danger';
        }
    }
    </script>
</body>
</html>
